name: Prototype checks
on:
  push:
    branches: [work/first-version, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install teacher build dependencies
        run: python3 -m pip install -r teacher/requirements.txt
      - name: Test teacher service
        run: python3 -m unittest discover -s teacher -p 'test_*.py' -v
      - name: Test policy core
        run: make test
      - name: Test teacher update UI interruption and repeated actions
        run: node tests/update_ui_test.js
      - name: Compare native and Python package validation
        run: python tests/update_package_parity.py --client ./update-package-test
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned TUN engine
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip -OutFile sing-box.zip
          if ((Get-FileHash sing-box.zip -Algorithm SHA256).Hash.ToLower() -ne '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df') { throw 'TUN archive SHA-256 mismatch' }
          Expand-Archive sing-box.zip -DestinationPath tun-upstream
          Copy-Item (Get-ChildItem tun-upstream -Recurse -Filter sing-box.exe | Select-Object -First 1).FullName ohno-tun.exe
          Copy-Item windows/sing-box-LICENSE.txt sing-box-LICENSE.txt
          Copy-Item windows/wintun-LICENSE.txt wintun-LICENSE.txt
      - name: Build native service scaffold
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR exit /b 1
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE windows\service.cpp windows\update_configuration.cpp windows\update_runtime.cpp windows\worker_process.cpp windows\update_client.cpp windows\update_payload.cpp windows\update_journal.cpp windows\update_verify.cpp windows\maintenance_http.cpp windows\agent.cpp windows\monitor.cpp windows\browser_policy.cpp windows\network_filter.cpp windows\request_pipe.cpp windows\tun_manager.cpp src\policy.cpp /Fe:ohno-service-prototype.exe crypt32.lib advapi32.lib winhttp.lib bcrypt.lib wtsapi32.lib fwpuclnt.lib rpcrt4.lib iphlpapi.lib
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE windows\request_gui.cpp src\policy.cpp /Fe:ohno-request.exe user32.lib /link /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\setup_bundle_test.cpp /Fe:setup-bundle-test.exe
          if errorlevel 1 exit /b 1
          setup-bundle-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\mac_identity_test.cpp /Fe:mac-identity-test.exe
          if errorlevel 1 exit /b 1
          mac-identity-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\update_package_test.cpp /Fe:update-package-test.exe
          if errorlevel 1 exit /b 1
          update-package-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\update_transaction_test.cpp /Fe:update-transaction-test.exe
          if errorlevel 1 exit /b 1
          update-transaction-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DOHNO_UPDATE_IO_TESTING tests\windows_update_journal.cpp windows\update_journal.cpp /Fe:update-journal-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DOHNO_UPDATE_IO_TESTING tests\windows_update_client.cpp windows\update_client.cpp windows\update_payload.cpp windows\update_journal.cpp windows\update_verify.cpp windows\maintenance_http.cpp /Fe:update-client-test.exe bcrypt.lib winhttp.lib crypt32.lib
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_worker_fixture.cpp /Fe:worker-fixture.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DOHNO_UPDATE_IO_TESTING tests\windows_update_runtime.cpp windows\update_runtime.cpp windows\worker_process.cpp windows\update_client.cpp windows\update_payload.cpp windows\update_journal.cpp windows\update_verify.cpp windows\maintenance_http.cpp /Fe:update-runtime-test.exe bcrypt.lib winhttp.lib crypt32.lib
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE windows\worker.cpp windows\agent.cpp windows\monitor.cpp windows\browser_policy.cpp windows\network_filter.cpp windows\request_pipe.cpp windows\tun_manager.cpp src\policy.cpp /Fe:ohno-worker.exe advapi32.lib winhttp.lib bcrypt.lib wtsapi32.lib fwpuclnt.lib rpcrt4.lib iphlpapi.lib
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_maintenance_client.cpp windows\maintenance_http.cpp /Fe:maintenance-client.exe winhttp.lib crypt32.lib
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_pipe_test.cpp windows\request_pipe.cpp src\policy.cpp /Fe:pipe-test.exe advapi32.lib
          if errorlevel 1 exit /b 1
          pipe-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_pipe_client.cpp /Fe:pipe-client.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\tun_config_emit.cpp src\policy.cpp /Fe:tun-config.exe
          if errorlevel 1 exit /b 1
          tun-config.exe > generated-tun.json
          ohno-tun.exe check -c generated-tun.json
          if errorlevel 1 exit /b 1
          rc /fo setup.res windows\setup.rc
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE windows\setup.cpp windows\setup_ui.cpp windows\setup_bundle_win.cpp windows\maintenance_http.cpp windows\browser_policy.cpp src\policy.cpp setup.res /Fe:ohno-setup.exe advapi32.lib shell32.lib ole32.lib winhttp.lib crypt32.lib uuid.lib comdlg32.lib user32.lib /link /MANIFEST:NO /SUBSYSTEM:WINDOWS /ENTRY:wmainCRTStartup
          if errorlevel 1 exit /b 1
          cl /std:c++17 /EHsc /W4 /MT /Isrc tests\policy_test.cpp src\policy.cpp /Fe:policy-test.exe
          if errorlevel 1 exit /b 1
          policy-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\client_policy_test.cpp src\policy.cpp /Fe:client-policy-test.exe
          if errorlevel 1 exit /b 1
          client-policy-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\approval_queue_test.cpp src\policy.cpp /Fe:approval-queue-test.exe
          if errorlevel 1 exit /b 1
          approval-queue-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\update_manifest_test.cpp /Fe:update-manifest-test.exe
          if errorlevel 1 exit /b 1
          update-manifest-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_update_verify_test.cpp windows\update_verify.cpp /Fe:update-verify-test.exe bcrypt.lib
          if errorlevel 1 exit /b 1
          update-verify-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\json_test.cpp /Fe:json-test.exe
          if errorlevel 1 exit /b 1
          json-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_browser_policy_test.cpp windows\browser_policy.cpp src\policy.cpp /Fe:browser-policy-test.exe advapi32.lib
          if errorlevel 1 exit /b 1
          browser-policy-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_network_target.cpp /Fe:network-target.exe ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_network_test.cpp windows\network_filter.cpp /Fe:network-test.exe ws2_32.lib fwpuclnt.lib rpcrt4.lib
          if errorlevel 1 exit /b 1
          network-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_target.cpp /Fe:test-target.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_origin_test.cpp windows\monitor.cpp /Fe:origin-test.exe bcrypt.lib wtsapi32.lib
          if errorlevel 1 exit /b 1
          origin-test.exe
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_monitor_test.cpp windows\monitor.cpp /Fe:monitor-test.exe bcrypt.lib wtsapi32.lib
          if errorlevel 1 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_hash_test.cpp windows\monitor.cpp /Fe:hash-test.exe bcrypt.lib wtsapi32.lib
          if errorlevel 1 exit /b 1
          hash-test.exe
          if errorlevel 1 exit /b 1
          for /f %%h in ('powershell -NoProfile -Command "(Get-FileHash test-target.exe -Algorithm SHA256).Hash.ToLower()"') do set "HASH=%%h"
          monitor-test.exe %HASH%
          if errorlevel 1 exit /b 1
      - name: Upload client prototype
        uses: actions/upload-artifact@v4
        with:
          name: ohno-client-prototype-windows-x64
          path: |
            ohno-service-prototype.exe
            ohno-setup.exe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install teacher test dependencies
        shell: cmd
        run: python -m pip install -r teacher/requirements.txt
      - name: Test teacher release catalog and private fixture-directory permissions
        shell: cmd
        run: python -m unittest discover -s teacher -p "test_update_*.py" -v
      - name: Compare package parsers on Windows
        shell: cmd
        run: python tests\update_package_parity.py --client update-package-test.exe
      - name: Exercise native journal crash recovery in temporary NTFS directories
        shell: cmd
        run: python tests\windows_update_journal.py --client update-journal-test.exe
      - name: Exercise native signed package pulling and interrupted staging
        shell: cmd
        run: python tests\windows_update_staging.py --client update-client-test.exe
      - name: Exercise private workers, activation, rollback and STOP in temporary directories
        shell: cmd
        run: python tests\windows_update_runtime.py --client update-runtime-test.exe --worker worker-fixture.exe
      - name: Exercise native TLS and maintenance protocol adversaries
        shell: cmd
        run: python tests\windows_maintenance_transport.py --client maintenance-client.exe
      - name: Exercise authorization refusals before any setup mutation
        shell: cmd
        run: python tests\windows_setup_authorization.py
      - name: Verify Edge domain policy
        shell: cmd
        run: python tests\windows_edge_probe.py
      - name: Exercise teacher and native service together
        shell: cmd
        run: python tests\windows_end_to_end.py
      - name: Bundle teacher prototype
        shell: cmd
        run: |
          python -m pip install pyinstaller==6.16.0 -r teacher/requirements.txt
          if errorlevel 1 exit /b 1
          python -m PyInstaller --onefile --name ohno-teacher --add-binary "ohno-setup.exe;." --add-data "teacher/update_ui.js;." teacher\server.py
          if errorlevel 1 exit /b 1
          dist\ohno-teacher.exe --help
          if errorlevel 1 exit /b 1
          dist\ohno-teacher.exe --generate-certificate --host localhost --cert %TEMP%\ohno-cert.pem --key %TEMP%\ohno-key.pem
          if errorlevel 1 exit /b 1
          python tests\collect_licenses.py
          if errorlevel 1 exit /b 1
      - name: Upload teacher prototype
        uses: actions/upload-artifact@v4
        with:
          name: ohno-teacher-prototype-windows-x64
          path: |
            dist/ohno-teacher.exe
            dist/licenses
  publish-prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release ')
    needs: [linux, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate release version
        id: version
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="v$(cat VERSION)"
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$'
          if [[ ! "$tag" =~ $pattern ]]; then echo 'Invalid VERSION' >&2; exit 1; fi
          if [[ "$RELEASE_MESSAGE" != *"[release $tag]"* ]]; then echo 'Release marker does not match VERSION' >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ohno-client-prototype-windows-x64
          path: release/client
      - uses: actions/download-artifact@v4
        with:
          name: ohno-teacher-prototype-windows-x64
          path: release/teacher
      - name: Package and publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp release/client/ohno-setup.exe release/ohno-setup.exe
          cp release/teacher/ohno-teacher.exe release/ohno-teacher.exe
          cp docs/trial-guide.md release/client/trial-guide.md
          cp docs/trial-guide.md release/teacher/trial-guide.md
          cp LICENSE release/client/AGPL-3.0.txt
          cp LICENSE release/teacher/AGPL-3.0.txt
          cp windows/sing-box-LICENSE.txt release/client/sing-box-LICENSE.txt
          cp windows/wintun-LICENSE.txt release/client/wintun-LICENSE.txt
          (cd release/client && zip -q ../ohno-client-windows-x64.zip ohno-setup.exe trial-guide.md AGPL-3.0.txt sing-box-LICENSE.txt wintun-LICENSE.txt)
          (cd release/teacher && zip -qr ../ohno-teacher-windows-x64.zip ohno-teacher.exe licenses trial-guide.md AGPL-3.0.txt)
          (cd release && sha256sum ohno-setup.exe ohno-teacher.exe ohno-client-windows-x64.zip ohno-teacher-windows-x64.zip > SHA256SUMS)
          gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" --title "ohno $RELEASE_TAG" --notes-file docs/release-notes.md release/ohno-setup.exe release/ohno-teacher.exe release/ohno-client-windows-x64.zip release/ohno-teacher-windows-x64.zip release/SHA256SUMS
