name: Build, test, and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enforce zero Python files in repository
        run: |
          if [ -n "$(git ls-files '*.py')" ]; then
            echo "Python files found in repository:" >&2
            git ls-files '*.py' >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Test Go teacher service
        run: go test -race -v ./teacher/...
      - name: Test C++17 policy and update core
        run: make test-cpp
      - name: Test Go/C++ package parity and portable TLS fixtures
        run: OHNO_UPDATE_PACKAGE_TEST="$PWD/update-package-test" go test -v ./tests/integration
      - name: Test teacher update UI interruption and repeated actions
        run: node tests/update_ui_test.js
      - name: Build native Linux teacher binary
        run: |
          VERSION="$(cat VERSION)"
          mkdir -p dist/linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.Version=v${VERSION}" -o dist/linux/ohno-teacher ./cmd/ohno-teacher
          ./dist/linux/ohno-teacher --version
      - name: Upload Linux teacher binary
        uses: actions/upload-artifact@v4
        with:
          name: ohno-teacher-linux-amd64
          path: dist/linux/ohno-teacher

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Verify native command exit gates include crash statuses
        shell: cmd
        run: go test -v ./tests/integration -run TestWindowsCmdExitGate
      - name: Fetch pinned TUN engine
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip -OutFile sing-box.zip
          if ((Get-FileHash sing-box.zip -Algorithm SHA256).Hash.ToLower() -ne '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df') { throw 'TUN archive SHA-256 mismatch' }
          Expand-Archive sing-box.zip -DestinationPath tun-upstream
          Copy-Item (Get-ChildItem tun-upstream -Recurse -Filter sing-box.exe | Select-Object -First 1).FullName ohno-tun.exe
          Copy-Item windows/sing-box-LICENSE.txt sing-box-LICENSE.txt
          Copy-Item windows/wintun-LICENSE.txt wintun-LICENSE.txt
      - name: Build native Go package builder
        shell: cmd
        run: |
          go build -trimpath -ldflags="-s -w" -o ohno-pkg.exe ./cmd/ohno-pkg
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
      - name: Build and test native Windows client binaries
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR exit /b 1
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE windows\service.cpp windows\update_configuration.cpp windows\update_runtime.cpp windows\worker_process.cpp windows\update_client.cpp windows\update_payload.cpp windows\update_journal.cpp windows\update_verify.cpp windows\maintenance_http.cpp windows\agent.cpp windows\monitor.cpp windows\browser_policy.cpp windows\network_filter.cpp windows\request_pipe.cpp windows\tun_manager.cpp src\policy.cpp /Fe:ohno-service.exe crypt32.lib advapi32.lib winhttp.lib bcrypt.lib wtsapi32.lib fwpuclnt.lib rpcrt4.lib iphlpapi.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE windows\request_gui.cpp windows\request_client.cpp src\policy.cpp /Fe:ohno-request.exe advapi32.lib user32.lib /link /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\setup_bundle_test.cpp /Fe:setup-bundle-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          setup-bundle-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\mac_identity_test.cpp /Fe:mac-identity-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          mac-identity-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\update_package_test.cpp /Fe:update-package-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          update-package-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\update_transaction_test.cpp /Fe:update-transaction-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          update-transaction-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DOHNO_UPDATE_IO_TESTING tests\windows_update_journal.cpp windows\update_journal.cpp /Fe:update-journal-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DOHNO_UPDATE_IO_TESTING tests\windows_update_client.cpp windows\update_client.cpp windows\update_payload.cpp windows\update_journal.cpp windows\update_verify.cpp windows\maintenance_http.cpp /Fe:update-client-test.exe bcrypt.lib winhttp.lib crypt32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_worker_fixture.cpp /Fe:worker-fixture.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DOHNO_UPDATE_IO_TESTING tests\windows_update_runtime.cpp windows\update_runtime.cpp windows\worker_process.cpp windows\update_client.cpp windows\update_payload.cpp windows\update_journal.cpp windows\update_verify.cpp windows\maintenance_http.cpp /Fe:update-runtime-test.exe bcrypt.lib winhttp.lib crypt32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE windows\worker.cpp windows\agent.cpp windows\maintenance_http.cpp windows\monitor.cpp windows\browser_policy.cpp windows\network_filter.cpp windows\request_pipe.cpp windows\tun_manager.cpp src\policy.cpp /Fe:ohno-worker.exe crypt32.lib advapi32.lib winhttp.lib bcrypt.lib wtsapi32.lib fwpuclnt.lib rpcrt4.lib iphlpapi.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_installed_update_probe.cpp windows\update_configuration.cpp windows\update_verify.cpp windows\maintenance_http.cpp /Fe:installed-update-probe.exe advapi32.lib bcrypt.lib winhttp.lib crypt32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_device_transport.cpp windows\maintenance_http.cpp /Fe:device-transport-test.exe winhttp.lib crypt32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_maintenance_client.cpp windows\maintenance_http.cpp /Fe:maintenance-client.exe winhttp.lib crypt32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_pipe_test.cpp windows\request_pipe.cpp src\policy.cpp /Fe:pipe-test.exe advapi32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          pipe-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_request_client_test.cpp windows\request_client.cpp windows\request_pipe.cpp src\policy.cpp /Fe:request-client-test.exe advapi32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          request-client-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_request_io_test.cpp /Fe:request-io-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          request-io-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE windows\request_gui.cpp tests\windows_request_gui_stub.cpp src\policy.cpp /Fe:request-ui-fixture.exe user32.lib /link /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          go test -v ./tests/integration -run TestWindowsRequestGUI
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_pipe_client.cpp windows\request_client.cpp /Fe:pipe-client.exe advapi32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\tun_config_emit.cpp src\policy.cpp /Fe:tun-config.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          tun-config.exe > generated-tun.json
          ohno-tun.exe check -c generated-tun.json
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_installed_payload.cpp windows\installed_payload.cpp windows\update_payload.cpp windows\update_journal.cpp windows\update_verify.cpp /Fe:installed-payload-test.exe bcrypt.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          rc /fo maintenance.res windows\maintenance.rc
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE /DOHNO_PAYLOAD_MAINTENANCE windows\setup.cpp windows\setup_ui.cpp windows\setup_bundle_win.cpp windows\maintenance_http.cpp windows\browser_policy.cpp src\policy.cpp windows\installed_payload.cpp windows\update_payload.cpp windows\update_journal.cpp windows\update_verify.cpp maintenance.res /Fe:ohno-maintenance.exe advapi32.lib shell32.lib ole32.lib winhttp.lib crypt32.lib uuid.lib comdlg32.lib user32.lib /link /MANIFEST:NO /SUBSYSTEM:WINDOWS /ENTRY:wmainCRTStartup
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE windows\request_launcher.cpp windows\update_configuration.cpp windows\installed_payload.cpp windows\update_payload.cpp windows\update_journal.cpp windows\update_verify.cpp /Fe:ohno-request-launcher.exe advapi32.lib user32.lib bcrypt.lib /link /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          for /f %%v in (VERSION) do ohno-pkg.exe --version %%v --directory . --output ohno-initial.ohno
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          rc /fo setup.res windows\setup.rc
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /DUNICODE /D_UNICODE windows\setup.cpp windows\setup_ui.cpp windows\setup_bundle_win.cpp windows\maintenance_http.cpp windows\browser_policy.cpp src\policy.cpp windows\installed_payload.cpp windows\update_payload.cpp windows\update_journal.cpp windows\update_verify.cpp setup.res /Fe:ohno-setup.exe advapi32.lib shell32.lib ole32.lib winhttp.lib crypt32.lib uuid.lib comdlg32.lib user32.lib /link /MANIFEST:NO /SUBSYSTEM:WINDOWS /ENTRY:wmainCRTStartup
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /std:c++17 /EHsc /W4 /MT /Isrc tests\policy_test.cpp src\policy.cpp /Fe:policy-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          policy-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\client_policy_test.cpp src\policy.cpp /Fe:client-policy-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          client-policy-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\approval_queue_test.cpp src\policy.cpp /Fe:approval-queue-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          approval-queue-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\update_manifest_test.cpp /Fe:update-manifest-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          update-manifest-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_update_verify_test.cpp windows\update_verify.cpp /Fe:update-verify-test.exe bcrypt.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          update-verify-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT /Isrc tests\json_test.cpp /Fe:json-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          json-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_browser_policy_test.cpp windows\browser_policy.cpp src\policy.cpp /Fe:browser-policy-test.exe advapi32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          browser-policy-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_network_target.cpp /Fe:network-target.exe ws2_32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_network_test.cpp windows\network_filter.cpp /Fe:network-test.exe ws2_32.lib fwpuclnt.lib rpcrt4.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          network-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_target.cpp /Fe:test-target.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_origin_test.cpp windows\monitor.cpp /Fe:origin-test.exe bcrypt.lib wtsapi32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          origin-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_monitor_test.cpp windows\monitor.cpp /Fe:monitor-test.exe bcrypt.lib wtsapi32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          cl /utf-8 /std:c++17 /EHsc /W4 /MT tests\windows_hash_test.cpp windows\monitor.cpp /Fe:hash-test.exe bcrypt.lib wtsapi32.lib
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          hash-test.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          for /f %%h in ('powershell -NoProfile -Command "(Get-FileHash test-target.exe -Algorithm SHA256).Hash.ToLower()"') do set "HASH=%%h"
          monitor-test.exe %HASH%
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
      - name: Build native self-contained Windows teacher executable
        shell: cmd
        run: |
          if not exist teacher\embedded mkdir teacher\embedded
          copy /y ohno-setup.exe teacher\embedded\ohno-setup.exe
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          if not exist dist mkdir dist
          for /f %%v in (VERSION) do go build -tags embed_setup -trimpath -ldflags="-s -w -X main.Version=v%%v" -o dist\ohno-teacher.exe ./cmd/ohno-teacher
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          dist\ohno-teacher.exe --version
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
          dist\ohno-teacher.exe --generate-certificate --host localhost --cert %TEMP%\ohno-cert.pem --key %TEMP%\ohno-key.pem
          if errorlevel 1 exit /b 1
          if not errorlevel 0 exit /b 1
      - name: Upload request window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohno-request-window-evidence
          path: request-ui-evidence/*.bmp
          if-no-files-found: ignore
      - name: Test teacher release catalog and Windows DACLs
        shell: cmd
        run: go test -v ./teacher/...
      - name: Compare Go and native package parsers on Windows
        shell: cmd
        env:
          OHNO_UPDATE_PACKAGE_TEST: ${{ github.workspace }}\update-package-test.exe
        run: go test -v ./tests/integration -run TestUpdatePackageParity
      - name: Exercise native journal crash recovery in temporary NTFS directories
        shell: cmd
        run: go test -v ./tests/integration -run TestWindowsUpdateJournal
      - name: Exercise native signed package pulling and interrupted staging
        shell: cmd
        run: go test -v ./tests/integration -run TestWindowsUpdateStaging
      - name: Exercise private workers, activation, rollback and STOP in temporary directories
        shell: cmd
        run: go test -v ./tests/integration -run TestWindowsUpdateRuntime
      - name: Verify read-only selectors and conservative payload removal
        shell: cmd
        run: go test -v ./tests/integration -run TestWindowsInstalledPayload
      - name: Exercise native TLS and maintenance protocol adversaries
        shell: cmd
        run: go test -v ./tests/integration -run TestWindowsMaintenanceTransport
      - name: Exercise daily device TLS before sending secrets
        shell: cmd
        run: go test -v ./tests/integration -run TestWindowsDeviceTransport
      - name: Exercise authorization refusals before any setup mutation
        shell: cmd
        run: go test -v ./tests/integration -run TestWindowsSetupAuthorization
      - name: Verify Edge domain policy
        shell: cmd
        env:
          OHNO_RUN_EDGE_PROBE: '1'
        run: go test -v ./tests/integration -run TestWindowsEdgePolicyProbe
      - name: Exercise native teacher and managed Windows service end-to-end
        shell: cmd
        env:
          OHNO_RUN_E2E: '1'
        run: go test -v -timeout 25m ./tests/integration -run TestWindowsEndToEnd
      - name: Upload Windows client release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ohno-client-windows-x64
          path: |
            ohno-service.exe
            ohno-setup.exe
            ohno-initial.ohno
      - name: Upload Windows teacher release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohno-teacher-windows-x64
          path: dist/ohno-teacher.exe

  publish-release:
    if: github.event_name == 'push' && ((github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release ')) || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate release version
        id: version
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          tag="v$(cat VERSION)"
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$'
          if [[ ! "$tag" =~ $pattern ]]; then echo 'Invalid VERSION' >&2; exit 1; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then echo 'Git tag does not match VERSION' >&2; exit 1; fi
          else
            if [[ "$RELEASE_MESSAGE" != *"[release $tag]"* ]]; then echo 'Release marker does not match VERSION' >&2; exit 1; fi
          fi
          prerelease="false"
          if [[ "$tag" == *-* ]]; then prerelease="true"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ohno-client-windows-x64
          path: release/client
      - uses: actions/download-artifact@v4
        with:
          name: ohno-teacher-windows-x64
          path: release/teacher
      - uses: actions/download-artifact@v4
        with:
          name: ohno-teacher-linux-amd64
          path: release/linux
      - name: Package and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          mkdir -p release/teacher/licenses release/linux/licenses
          cp release/client/ohno-setup.exe release/ohno-setup.exe
          cp release/client/ohno-initial.ohno release/ohno-update-windows-x64.ohno
          cp release/teacher/ohno-teacher.exe release/ohno-teacher.exe
          cp docs/trial-guide.md release/client/trial-guide.md
          cp docs/trial-guide.md release/teacher/trial-guide.md
          cp LICENSE release/client/AGPL-3.0.txt
          cp LICENSE release/teacher/AGPL-3.0.txt
          cp LICENSE release/linux/AGPL-3.0.txt
          cp docs/go-LICENSE.txt release/teacher/licenses/go-LICENSE.txt
          cp docs/go-LICENSE.txt release/linux/licenses/go-LICENSE.txt
          cp windows/sing-box-LICENSE.txt release/client/sing-box-LICENSE.txt
          cp windows/wintun-LICENSE.txt release/client/wintun-LICENSE.txt
          chmod +x release/linux/ohno-teacher
          (cd release/client && zip -q ../ohno-client-windows-x64.zip ohno-setup.exe trial-guide.md AGPL-3.0.txt sing-box-LICENSE.txt wintun-LICENSE.txt)
          (cd release/teacher && zip -qr ../ohno-teacher-windows-x64.zip ohno-teacher.exe licenses trial-guide.md AGPL-3.0.txt)
          (cd release/linux && tar -czf ../ohno-teacher-linux-amd64.tar.gz ohno-teacher licenses AGPL-3.0.txt)
          (cd release && sha256sum ohno-setup.exe ohno-teacher.exe ohno-update-windows-x64.ohno ohno-client-windows-x64.zip ohno-teacher-windows-x64.zip ohno-teacher-linux-amd64.tar.gz > SHA256SUMS)
          args=(--target "$GITHUB_SHA" --title "ohno $RELEASE_TAG" --notes-file docs/release-notes.md)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" \
            release/ohno-setup.exe \
            release/ohno-teacher.exe \
            release/ohno-update-windows-x64.ohno \
            release/ohno-client-windows-x64.zip \
            release/ohno-teacher-windows-x64.zip \
            release/ohno-teacher-linux-amd64.tar.gz \
            release/SHA256SUMS
